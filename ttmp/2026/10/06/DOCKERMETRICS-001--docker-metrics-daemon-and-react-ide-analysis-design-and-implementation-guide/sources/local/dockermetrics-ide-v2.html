<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>dockermetrics IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>:root{--bg:#e8ebee;--panel:#f5f6f7;--panel2:#e0e4e8;--fg:#14181c;--mut:#5b6670;--line:#c9d0d6;--acc:#b7791f;--accfg:#fff;--ok:#1f8a4c;--warn:#a8660a;--bad:#c0392b;--ed:#fbfcfc;
--k:#7b3fa0;--s:#2a7a3b;--n:#b4560f;--c:#7b8893;--f:#1d5fa8;--a:#0b7f8c;--p:#3a4650;--sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--fs:13px;--lh:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f13;--panel:#10171d;--panel2:#18222b;--fg:#dbe3ea;--mut:#8493a0;--line:#223039;--acc:#e8b339;--accfg:#1a1405;--ok:#52c882;--warn:#e8b339;--bad:#f0685a;--ed:#0c1318;--k:#c792ea;--s:#a5d6a0;--n:#f2a65e;--c:#5f7384;--f:#7cb7ff;--a:#4fd1c5;--p:#b8c4cf}}
:root[data-theme="dark"]{--bg:#0a0f13;--panel:#10171d;--panel2:#18222b;--fg:#dbe3ea;--mut:#8493a0;--line:#223039;--acc:#e8b339;--accfg:#1a1405;--ok:#52c882;--warn:#e8b339;--bad:#f0685a;--ed:#0c1318;--k:#c792ea;--s:#a5d6a0;--n:#f2a65e;--c:#5f7384;--f:#7cb7ff;--a:#4fd1c5;--p:#b8c4cf}
@media (pointer:coarse){:root{--fs:16px;--lh:24px}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
#root{height:100%}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:-.01em;font-size:15px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;min-height:32px}
.btn:hover{border-color:var(--mut)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12px}
.btn.ghost{background:transparent}
.btn.icon{width:32px;padding:0}
.btn.run{background:var(--acc);border-color:var(--acc);color:var(--accfg);padding:6px 18px}
.btn.stop{background:transparent;border-color:var(--bad);color:var(--bad)}
.simctl{display:flex;align-items:center;gap:6px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-height:32px}
.clock{font:12px var(--mono);color:var(--mut);min-width:62px}
.seg{display:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;cursor:pointer}
.seg .on{background:var(--fg);color:var(--bg)}
.main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.code-pane{border-right:1px solid var(--line);background:var(--ed)}
.pane-h{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.file{font:12px var(--mono);padding:2px 8px;border-radius:4px;background:var(--panel2)}
.ttl{flex:1;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{padding:5px 10px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);background:var(--panel)}
.editor{flex:1;min-height:0;display:flex}
.gutter{width:42px;flex:none;overflow:hidden;background:var(--panel);border-right:1px solid var(--line);color:var(--c);text-align:right;user-select:none}
.gutter pre,.hl,.input{margin:0;font:var(--fs)/var(--lh) var(--mono);tab-size:2}
.gutter pre{padding:10px 8px 10px 0}
.code-wrap{position:relative;flex:1;min-width:0}
.hl,.input{position:absolute;inset:0;padding:10px 12px;white-space:pre;overflow:auto;border:0;word-wrap:normal}
.hl{overflow:hidden;pointer-events:none;color:var(--fg)}
.input{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg);resize:none;outline:none;width:100%;height:100%}
.input::selection{background:color-mix(in srgb,var(--acc) 35%,transparent);-webkit-text-fill-color:transparent}
.t-c{color:var(--c);font-style:italic}.t-s{color:var(--s)}.t-n{color:var(--n)}.t-k{color:var(--k)}.t-f{color:var(--f)}.t-a{color:var(--a);font-weight:600}.t-p{color:var(--p)}
.tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs .on{color:var(--fg);border-bottom-color:var(--acc)}
.view-pane{background:var(--bg)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow:auto;flex:1;min-height:0}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel);font-size:12px}
.st{font:12px var(--mono);color:var(--mut);margin-right:4px}.st.err{color:var(--bad)}.st.ok{color:var(--ok)}.st.run{color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 10px;font:11.5px var(--mono);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--mut);font-size:15px;line-height:1;padding:2px 6px}
.console{padding:8px 0;font:12.5px/1.5 var(--mono)}
.line{margin:0;padding:1px 12px;white-space:pre-wrap;word-break:break-word;font:inherit}
.line.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.line.error{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.empty{padding:22px 16px;color:var(--mut);font-size:13.5px;max-width:46ch}
.empty b{color:var(--fg)}
.tbl-wrap{overflow-x:auto;padding:4px 12px}
table{border-collapse:collapse;font:12px var(--mono)}
th,td{padding:3px 12px 3px 0;text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line)}
td.num{text-align:right;padding-right:14px}
.fleet{display:flex;flex-direction:column;flex:1;min-height:0}
.fleet-bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.fleet-body{padding:0 10px 10px}
.host{margin:14px 0 6px;font:600 12px var(--mono);color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 9px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.card.off{opacity:.55}
.card-h{display:flex;align-items:center;gap:6px;min-width:0}
.card-h b{font:600 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.dot.restarting{background:var(--warn)}.dot.stopped{background:var(--c)}
.badge{font:600 10px var(--mono);padding:0 5px;border-radius:3px}
.badge.spike{background:var(--bad);color:#fff}.badge.leak{background:var(--warn);color:var(--bg)}
.rs{margin-left:auto;font:11px var(--mono);color:var(--mut)}
.img{font:11px var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--mut)}
.bl{width:24px}.bv{width:30px;text-align:right}
.track{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}.track i{display:block;height:100%}
.spark{width:100%;height:24px;display:block;margin-top:2px}
.dock{border-top:1px solid var(--line);background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.dock-t{display:flex;gap:10px;align-items:baseline}.dock-t b{font:600 13px var(--mono)}.dock-t span{color:var(--mut);font-size:12px}
.dock-b{display:flex;gap:6px;flex-wrap:wrap}
.charts{padding:10px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chart{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.grid-l{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font:10px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font:11.5px var(--mono);cursor:pointer}
.lg i{width:9px;height:9px;border-radius:2px}.lg span{color:var(--mut)}.lg.off{opacity:.35}
.events{padding:6px 0}
.ev{display:flex;gap:10px;align-items:baseline;padding:4px 12px;font:12px var(--mono);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.ev time{color:var(--mut)}.ev .tag{min-width:58px;font-weight:600;color:var(--mut)}
.ev.rule .tag{color:var(--bad)}.ev.emit .tag{color:var(--acc)}.ev.restart .tag{color:var(--a)}.ev.chaos .tag{color:var(--warn)}
.sinks{padding:6px 12px 14px}.sinks h3{font:600 12px var(--mono);color:var(--mut);margin:14px 0 6px}
.dump{margin:0;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:11.5px/1.5 var(--mono);overflow:auto;max-height:260px}
.dump.wrap{white-space:pre-wrap;word-break:break-all}
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);z-index:5}
.drawer{position:absolute;z-index:6;top:0;bottom:0;left:0;width:min(400px,100%);background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:4px 0 16px}
.drawer h4{margin:16px 14px 4px;font-size:13px;color:var(--mut);font-weight:600}
.pre{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
.pre:hover{background:var(--panel2)}.pre.on{border-left-color:var(--acc);background:var(--panel2)}
.pre b{display:block;font-size:14px}.pre span{display:block;font-size:12.5px;color:var(--mut)}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--mut);font:13px var(--mono)}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.hide-m{display:none!important}.seg{display:flex;order:5}.sp{display:none}.top{gap:6px}.simctl{margin-left:auto}.code-pane{border-right:0}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dash{padding:10px}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dh h2{margin:0;font-size:18px;letter-spacing:-.01em}.when{font:11.5px var(--mono);color:var(--mut)}.dh .sp{flex:1;display:block}
.dvar{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--mut)}
.dsec{margin:14px 0 6px;font-size:13px;color:var(--mut);font-weight:600}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;min-width:min(100%,200px);display:flex;flex-direction:column;min-height:96px}
.w.warn{border-color:var(--warn)}.w.crit{border-color:var(--bad)}
.w-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-bottom:6px}.w-h b{font-weight:600;color:var(--fg)}
.w-b{flex:1;min-height:0;min-width:0}
.empty.sm{padding:10px 0;font-size:12.5px}
.werr{color:var(--bad);font:12px var(--mono);white-space:pre-wrap}
.w-stat .big{font:700 30px/1.1 var(--sans);letter-spacing:-.02em}
.delta{font:11px var(--mono);margin:2px 0 4px}
.wspark{width:100%;height:34px;display:block;margin-top:4px}
.wgauge{width:100%;max-width:190px;display:block;margin:0 auto}
.gv{font:700 20px var(--sans);fill:var(--fg)}
.wplot{width:100%;height:auto;display:block}
.wleg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font:11px var(--mono);color:var(--mut)}
.wleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.wdonut{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wdonut .dv{font:700 13px var(--mono);fill:var(--fg)}
.wdonut ul{list-style:none;margin:0;padding:0;flex:1;min-width:110px;font:11.5px var(--mono)}
.wdonut li{display:flex;align-items:center;gap:6px;padding:1px 0}.wdonut li i{width:8px;height:8px;border-radius:2px}.wdonut li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wdonut li em{font-style:normal;color:var(--mut)}
.wtbl{overflow-x:auto}.wtbl table{width:100%;font:12px var(--mono)}.wtbl th.r,.wtbl td.r{text-align:right;position:relative;padding-left:10px}
.wtbl td{padding:3px 0}.wtbl td:first-child{padding-right:10px}.cb{position:absolute;left:10px;top:50%;height:60%;transform:translateY(-50%);opacity:.22;border-radius:2px;max-width:calc(100% - 10px)}.wtbl td.r span{position:relative}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tile{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;font:11px var(--mono);min-width:0}.tile b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile span{font-size:14px;color:var(--fg)}
.trow,.srow{display:flex;align-items:center;gap:8px;font:11.5px var(--mono);padding:2px 0}
.tn{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}.tv{width:64px;text-align:right;flex:none}
.tt{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.tt i{display:block;height:100%}.sl{flex:1;min-width:0}
.wev{font-size:11.5px}.wev .ev{padding:2px 0;border:0}
.wtext h5{margin:0 0 4px;font-size:14px}.wtext p{margin:3px 0;font-size:13px}.wtext .li{display:flex;gap:8px;font-size:13px;margin:2px 0}.wtext .li i{width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none}
.wkv{margin:0;font:12px var(--mono)}.wkv div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.wkv dt{color:var(--mut)}.wkv dd{margin:0}
code{font:12px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
</style></head>

<script>/* dockermetrics — composable grammar over a simulated Docker fleet (runs entirely in the browser) */
(function (G) {
"use strict";
const MAXH = 3600, PREFILL = 1800, MB = 1048576;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
let seed = 42;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const sec = (d) => {
  if (typeof d === "number") return d;
  const m = /^(\d+(?:\.\d+)?)\s*(ms|s|m|h|d)$/.exec(String(d).trim());
  if (!m) throw new Error('bad duration "' + d + '" — use e.g. "30s", "5m", "1h"');
  return parseFloat(m[1]) * ({ ms: .001, s: 1, m: 60, h: 3600, d: 86400 }[m[2]]);
};

/* ───────────── simulated world ───────────── */

class Sim {
  constructor([host, name, image, labels, b]) {
    this.host = host; this.name = name; this.image = image; this.labels = labels;
    this.b = { cpu: b.cpu, mem: b.mem * MB, rx: b.rx, tx: b.tx, pids: b.pids };
    this.limit = b.lim * MB; this.pidsLimit = 512; this.phase = rnd() * 6.28;
    this.reset();

const PRESETS = [{"id": "one-metric", "group": "Basics", "title": "One container, one metric", "desc": "Read a single number", "code": "// Simplest: one container, one metric.\n// cpu is a fraction of one core (0.42 = 42%).\nconst web = docker().container(\"web\");\n\nconsole.log(\"cpu\", await web.read(cpu));\nconsole.log(\"mem\", await web.read(mem), \"bytes\");\n"}, {"id": "multi-metric", "group": "Basics", "title": "Several metrics at once", "desc": "Pass an object, get an object", "code": "// Pass an object of metrics, get an object of values back.\nconst web = docker().container(\"web\");\n\nconst snap = await web.read({ cpu, mem, net, io, pids });\nconsole.log(snap);\n\n// net and io are counters; their parts are metrics too\nconsole.log(\"rx so far:\", await web.read(net.rx), \"bytes\");\n"}, {"id": "selectors", "group": "Basics", "title": "Selecting containers", "desc": "Name, glob, label, image, host", "code": "const d = docker();\nconst show = (label, group) =>\n  console.log(label.padEnd(22), group.names().join(\", \") || \"\u2014\");\n\nshow(\"container(web)\",     d.container(\"web\"));\nshow(\"containers(web-*)\",  d.containers(\"web-*\"));\nshow(\"label tier=backend\", d.containers({ label: \"tier=backend\" }));\nshow(\"label app=worker\",   d.containers({ label: \"app=worker\" }));\nshow(\"image /^postgres/\",  d.containers({ image: /^postgres/ }));\nshow(\"image node:20\",      d.containers({ image: \"node:20\" }));\nshow(\"all running\",        d.containers());\n\n// A group is a live selector: it re-resolves every time you use it.\nconst workers = d.containers(\"worker-*\");\nconsole.log(\"workers now:\", await workers.read(cpu));\n"}, {"id": "units", "group": "Basics", "title": "Units and derived values", "desc": "Pipes: mb, of(), pct, rate()", "code": "const web = docker().container(\"api-1\");\n\nconsole.log(\"mem (MB)      \", await web.read(mem.pipe(mb)));\nconsole.log(\"mem % of limit\", await web.read(mem.pipe(of(\"limit\"), pct)));\nconso nst sick  = or(hot, bloat);\n\nconsole.log(\"sick right now:\", await backend.read(sick));\nconsole.log(\"cpu above 25%: \", await backend.read(cpu.is(gt(0.25))));\n\nconsole.log(\"\u2192 spiking worker-1\u2026\");\nchaos.spike(\"worker-1\");\nawait sleep(\"130s\");\n\nconst w1 = d.container(\"worker-1\");\nconsole.log(\"hot now        \", await w1.check(hot));\nconsole.log(\"hot for 2 min  \", await w1.check(sustained(hot, \"2m\")));\n"}, {"id": "rules", "group": "Alerts", "title": "Rules: when \u2192 then", "desc": "Auto-restart after sustained CPU", "code": "const d = docker();\n\nd.on(\"alert\", ({ rule, container, value, at }) =>\n  console.warn(`[${rule}] ${container.name} cpu=${Number(value).toFixed(2)} @ ${time(at)}`));\n\nd.containers({ label: \"tier=backend\" }).watch(\n  rule(\"cpu-saturation\")\n    .when(sustained(cpu.is(gt(0.9)), \"2m\"))\n    .then(emit(\"alert\"), c => c.restart())\n    .cooldown(\"10m\")\n);\n\nconsole.log(\"watching backend\u2026 spiking api-1\");\nchaos.spike(\"api-1\");\nawait sleep(\"5m\");\nconsole.log(\"api-1 restarts:\", d.container(\"api-1\").inspect().restarts);\n"}, {"id": "events", "group": "Alerts", "title": "Event bus and wildcard listener", "desc": "Listen to everything", "code": "const d = docker();\n\n// \"*\" receives every event with its name as the 2nd argument\nd.on(\"*\", (e, name) => console.log(`${time(e.at)} \u2691 ${name}`, e.container.name));\nd.on(\"page\", e => console.warn(\"\ud83d\udcdf paging on-call about\", e.container.name));\n\nconst leaky = mem.pipe(of(\"limit\"), pct);\nd.containers(\"worker-*\").watch(\n  rule(\"high-mem\").when(leaky.is(gt(70))).then(emit(\"warn\")).cooldown(\"5m\"),\n  rule(\"critical-mem\").when(sustained(leaky.is(gt(85)), \"90s\")).then(emit(\"page\")).cooldown(\"15m\")\n);\n\nchaos.leak(\"worker-3\");\nconsole.log(\"worker-3 is leaking\u2026\");\nawait sleep(\"9m\");\n"}, {"id": "leak-heal", "group": "Alerts", "title": "Memory leak with self-healing", "desc": "Detect, page,
